<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pictogram Puzzles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #fef6ee;
        --surface: #ffffff;
        --surface2: #fff8f2;
        --border: rgba(0, 0, 0, 0.07);
        --border2: rgba(0, 0, 0, 0.12);
        --text-primary: #1e1a2e;
        --text-secondary: #6b6480;
        --text-muted: #b0a8c0;

        --coral: #ff6b6b;
        --teal: #2ec4b6;
        --yellow: #ffd166;
        --purple: #a78bfa;
        --blue: #4ea8de;
        --green: #6bcb77;

        --answer-color: #ff6b6b;
        --radius: 24px;
        --radius-sm: 14px;
        --radius-pill: 999px;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: "Nunito", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      /* decorative blobs */
      body::before {
        content: "";
        position: fixed;
        top: -120px;
        left: -120px;
        width: 420px;
        height: 420px;
        background: radial-gradient(circle, #ffd16655 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
      }
      body::after {
        content: "";
        position: fixed;
        bottom: -100px;
        right: -100px;
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, #2ec4b630 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
      }

      .card {
        width: 100%;
        max-width: 960px;
        height: calc(100vh - 40px);
        max-height: 900px;
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08),
          0 2px 8px rgba(0, 0, 0, 0.04);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }

      /* colored top stripe per slide */
      .card-stripe {
        height: 6px;
        width: 100%;
        transition: background 0.4s ease;
      }

      .card-header {
        padding: 18px 32px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .badge {
        font-family: "Fredoka One", cursive;
        font-size: 15px;
        letter-spacing: 0.03em;
        color: #fff;
        background: var(--coral);
        padding: 6px 16px;
        border-radius: var(--radius-pill);
        white-space: nowrap;
      }

      .counter {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-muted);
        letter-spacing: 0.06em;
      }

      .card-title {
        font-family: "Fredoka One", cursive;
        font-size: 36px;
        line-height: 1.15;
        color: var(--text-primary);
        padding: 14px 32px 4px;
      }

      .card-question {
        font-size: 17px;
        font-weight: 600;
        color: var(--text-secondary);
        padding: 0 32px 16px;
        line-height: 1.55;
      }

      .image-stage {
        margin: 0 20px;
        background: var(--surface2);
        border: 2px dashed #e8dff5;
        border-radius: var(--radius-sm);
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        transition: border-color 0.4s ease;
      }

      .image-stage img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        transition: opacity 0.3s ease;
      }

      .image-fallback {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 600;
      }
      .image-fallback svg {
        opacity: 0.35;
      }

      .answer-reveal {
        margin: 0 20px;
        border-radius: var(--radius-sm);
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.35s ease;
        opacity: 0;
      }
      .answer-reveal.visible {
        max-height: 160px;
        opacity: 1;
      }

      .answer-inner {
        border-radius: var(--radius-sm);
        background: #fff0f0;
        border: 2px solid #ffcece;
        padding: 16px 28px;
        text-align: center;
        margin-top: 12px;
      }

      .answer-label {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffaaaa;
        margin-bottom: 6px;
      }

      .answer-text {
        font-family: "Fredoka One", cursive;
        font-size: 56px;
        color: var(--coral);
        line-height: 1.05;
      }

      .card-footer {
        padding: 14px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 0 4px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #e8dff5;
        cursor: pointer;
        transition: background 0.2s ease,
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: none;
        padding: 0;
      }
      .dot.active {
        transform: scale(1.4);
      }
      .dot:hover:not(.active) {
        background: var(--text-muted);
        transform: scale(1.15);
      }

      .btn-row {
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        gap: 10px;
      }

      button {
        font-family: "Nunito", sans-serif;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: var(--radius-pill);
        padding: 14px 10px;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.15s ease, filter 0.15s ease;
        letter-spacing: 0.01em;
      }
      button:hover {
        filter: brightness(1.05);
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      }
      button:active {
        transform: scale(0.96) translateY(0);
        box-shadow: none;
      }

      .btn-nav {
        background: #f0ebff;
        color: #7c5cbf;
        border-color: #ddd3f7;
      }

      .btn-reveal {
        background: var(--coral);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 16px rgba(255, 107, 107, 0.35);
      }
      .btn-reveal:hover {
        box-shadow: 0 6px 20px rgba(255, 107, 107, 0.45);
      }
      .btn-reveal.active {
        background: #fff;
        color: var(--coral);
        border-color: var(--coral);
        box-shadow: none;
      }

      .slide-enter {
        animation: slideIn 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(22px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="card-stripe" id="card-stripe"></div>
      <div class="card-header">
        <span class="badge">Pictogram Puzzles</span>
        <span class="counter" id="counter">1 / 10</span>
      </div>

      <h1 class="card-title" id="riddle-title"></h1>
      <p class="card-question" id="riddle-question"></p>

      <div class="image-stage">
        <img
          id="riddle-img"
          src=""
          alt=""
          onerror="this.style.display='none'; document.getElementById('img-fallback').style.display='flex';"
          onload="this.style.display='block'; document.getElementById('img-fallback').style.display='none';"
        />
        <div class="image-fallback" id="img-fallback">
          <svg
            width="36"
            height="36"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <polyline points="21 15 16 10 5 21" />
          </svg>
          Image blocked by host
        </div>
      </div>

      <div class="answer-reveal" id="answer-reveal">
        <div class="answer-inner">
          <div class="answer-label">Answer</div>
          <div class="answer-text" id="riddle-answer"></div>
        </div>
      </div>

      <div class="card-footer">
        <div class="dots" id="dots"></div>
        <div class="btn-row">
          <button class="btn-nav" onclick="navigate(-1)">← Prev</button>
          <button class="btn-reveal" id="reveal-btn" onclick="toggleAnswer()">
            Reveal answer
          </button>
          <button class="btn-nav" onclick="navigate(1)">Next →</button>
        </div>
      </div>
    </div>

    <script>
      const riddles = [
        {
          image:
            "https://www.briddles.com/images/riddles/Simple-Rebus-Puzzle-336.gif",
          answer: "Breakfast",
        },
        {
          image:
            "https://www.briddles.com/images/riddles/Picture-Rebus-Riddle-434.jpg",
          answer: "Forgotten Heroes",
        },
        {
          image:
            "https://www.briddles.com/images/riddles/Rebus-Mind-Teaser-619.gif",
          answer: "No One to Blame",
        },
        {
          image:
            "https://www.rd.com/wp-content/uploads/2024/02/28-Rebus-Puzzles-That-Are-Almost-Impossible-to-Solve_Graphic-28.jpg?fit=750%2C750&original_fit=700,1024",
          answer: "Forgive & Forget",
        },
        {
          image:
            "https://www.briddles.com/images/riddles/Rebus-Picture-Meaning-Riddle-640.gif",
          answer: "Circle of Friends",
        },
        {
          image:
            "https://www.rd.com/wp-content/uploads/2024/02/28-Rebus-Puzzles-That-Are-Almost-Impossible-to-Solve_Graphic-26.jpg?fit=750%2C750&original_fit=700,1024",
          answer: "Street Corner",
        },
        {
          image:
            "https://www.briddles.com/images/riddles/Maths-Grid-Riddle-613.jpg",
          answer: "8",
        },
        {
          image:
            "https://www.rd.com/wp-content/uploads/2024/02/28-Rebus-Puzzles-That-Are-Almost-Impossible-to-Solve_Graphic-17.jpg?fit=750%2C750&original_fit=700,1024",
          answer: "Summer (Sum R)",
        },
        {
          image:
            "https://www.rd.com/wp-content/uploads/2024/02/28-Rebus-Puzzles-That-Are-Almost-Impossible-to-Solve_Graphic-18.jpg?fit=750%2C750&original_fit=700,1024",
          answer: "Metaphor",
        },
        {
          image:
            "https://www.rd.com/wp-content/uploads/2024/02/28-Rebus-Puzzles-That-Are-Almost-Impossible-to-Solve_Graphic-19.jpg?fit=750%2C750&original_fit=700,1024",
          answer: "Safety In Numbers",
        },
      ];

      let current = 0;
      let revealed = false;

      function render(direction = 0) {
        const r = riddles[current];
        const content = document.getElementById("card");

        if (direction !== 0) {
          content.classList.add("slide-enter");
          content.addEventListener(
            "animationend",
            () => content.classList.remove("slide-enter"),
            { once: true }
          );
        }

        document.getElementById("counter").textContent = `${current + 1} / ${
          riddles.length
        }`;
        document.getElementById("riddle-title").textContent = r.title;
        document.getElementById("riddle-question").textContent = r.question;

        const img = document.getElementById("riddle-img");
        img.style.display = "block";
        document.getElementById("img-fallback").style.display = "none";
        img.src = r.image;
        img.alt = r.title;

        document.getElementById("riddle-answer").textContent = r.answer;

        const revealBox = document.getElementById("answer-reveal");
        revealBox.classList.toggle("visible", revealed);

        const revealBtn = document.getElementById("reveal-btn");
        revealBtn.textContent = revealed ? "Hide answer" : "Reveal answer";
        revealBtn.classList.toggle("active", revealed);

        renderDots();
      }

      function renderDots() {
        const container = document.getElementById("dots");
        container.innerHTML = "";
        riddles.forEach((_, i) => {
          const dot = document.createElement("button");
          dot.className = "dot" + (i === current ? " active" : "");
          dot.setAttribute("aria-label", `Go to puzzle ${i + 1}`);
          dot.onclick = () => {
            current = i;
            revealed = false;
            render();
          };
          container.appendChild(dot);
        });
      }

      function navigate(dir) {
        current = (current + dir + riddles.length) % riddles.length;
        revealed = false;
        render(dir);
      }

      function toggleAnswer() {
        revealed = !revealed;
        const revealBox = document.getElementById("answer-reveal");
        revealBox.classList.toggle("visible", revealed);
        const revealBtn = document.getElementById("reveal-btn");
        revealBtn.textContent = revealed ? "Hide answer" : "Reveal answer";
        revealBtn.classList.toggle("active", revealed);
      }

      render();
    </script>
  </body>
</html>
